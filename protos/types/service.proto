syntax = "proto3";

package locator.types;
import "protos/types/health.proto";

option go_package = "github.com/hunkvm/locator/pkg/proto/types";

message Service {
  string id = 1;
  string name = 2;
  string address = 3;
  string version = 4;
  HealthStatus health_status = 5;
  HealthConfig health_check = 6;
  bool enabled = 7;
  map<string, string> metadata = 8;
  string last_checked = 9;
  string registered_at = 10;
}